name: Load data from Neon to BigQuery

on:
  workflow_dispatch:            # uruchomienie ręczne z zakładki Actions
    inputs:
      load_mode:
        description: "Tryb ładowania"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full_refresh
  schedule:
    - cron: '0 6 * * *'         # codziennie o 6:00 UTC (zawsze incremental)

jobs:
  extract-and-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP service account key to file
        run: echo '${{ secrets.GCP_SA_KEY }}' > gcp-key.json

      - name: Run extract and load script (all tables, FK order)
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
          BQ_PROJECT_ID: ida-projekt2-513811
          BQ_DATASET: shop
          LOAD_MODE: ${{ github.event.inputs.load_mode || 'incremental' }}
        run: python extract_load.py

      - name: Clean up key file
        if: always()
        run: rm -f gcp-key.json
